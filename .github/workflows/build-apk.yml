# Builds the release APKs from source on GitHub's machines (proves the build is reproducible).
name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "platforms;android-37.2" "build-tools;37.0.0" "ndk;30.0.14904198" "cmake;3.31.6" > /dev/null
      - name: Unit tests + release APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Installer-rules check (catches "problem parsing the package")
        run: python3 tools/verify_apk.py app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FreeGlobalVPN-apks
          path: app/build/outputs/apk/release/*.apk
