# Copy to .github/workflows/vpn-server-test.yml in a (private) GitHub repo together with test_servers.py
name: VPN Gate server test
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (optional)
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q openvpn curl
      - run: sudo python3 tools/vpn-server-test/test_servers.py --parallel 8 --timeout 30
      - run: cat results.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-server-test-results
          path: |
            results.json
            results.md
